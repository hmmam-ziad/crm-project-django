{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login &middot; Django CRM{% endblock %}

{% block content %}
<div class="container auth-wrap">
    <div class="surface auth-card">
        <div class="text-center mb-4">
            <div class="icon-box mx-auto mb-3"><i class="bi bi-box-arrow-in-right"></i></div>
            <h1 class="h3 mb-1">Welcome back</h1>
            <p class="text-secondary mb-0">Sign in to access your dashboard.</p>
        </div>

        <form method="POST" autocomplete="off">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-100 mt-2 py-2">Login</button>
        </form>

        <p class="text-center text-secondary mt-4 mb-0">
            Don't have an account? <a href="{% url 'register' %}" class="fw-semibold">Create one</a>
        </p>
    </div>
</div>
{% endblock %}
