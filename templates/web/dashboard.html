{% extends 'base.html' %}

{% block title %}Dashboard &middot; Django CRM{% endblock %}

{% block content %}
<div class="container page">
    <div class="page-header">
        <div>
            <h1>Welcome back, {{ user.username }} 👋</h1>
            <p>Here is an overview of all your records.</p>
        </div>
        <div class="stat-pill">
            <i class="bi bi-people"></i>
            <div><b>{{ records|length }}</b> <span>total records</span></div>
        </div>
    </div>

    <div class="surface overflow-hidden">
        <div class="toolbar">
            <form method="GET" action="{% url 'search_records' %}" class="search-box">
                <i class="bi bi-search"></i>
                <input type="search" class="form-control" placeholder="Search records..." name="query"
                    value="{{ request.GET.query }}">
                <button class="btn btn-primary" type="submit">Search</button>
            </form>
            <a href="{% url 'create_record' %}" class="btn btn-primary btn-new d-inline-flex align-items-center gap-2">
                <i class="bi bi-plus-lg"></i> New record
            </a>
        </div>

        {% include 'components/records_table.html' %}
    </div>
</div>
{% endblock %}
