{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Update record &middot; Django CRM{% endblock %}

{% block content %}
<div class="container page">
    <div class="surface form-card">
        <div class="head">
            <div class="icon-box"><i class="bi bi-pencil-square"></i></div>
            <div>
                <h1 class="h4 mb-0">Update record</h1>
                <small class="text-secondary">Edit the details and save your changes.</small>
            </div>
        </div>
        <div class="body">
            <form method="POST" autocomplete="off">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="form-actions">
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-soft">Cancel</a>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Save
                        changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
