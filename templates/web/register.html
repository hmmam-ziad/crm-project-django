{% extends 'base.html' %}

{% block content %}
<div class="container bg-light shadow-md p-5 form-layout">
    <h1>Create your account</h1>

    <hr>
    <form method="POST" autocomplete="off">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-outline-primary">Create</button>
    </form>
</div>
{% endblock %}
