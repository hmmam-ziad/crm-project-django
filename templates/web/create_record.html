{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Create record &middot; Django CRM{% endblock %}

{% block content %}
<div class="container page">
    <div class="surface form-card">
        <div class="head">
            <div class="icon-box"><i class="bi bi-person-plus"></i></div>
            <div>
                <h1 class="h4 mb-0">Create record</h1>
                <small class="text-secondary">Fill in the details below to add a new record.</small>
            </div>
        </div>
        <div class="body">
            <form method="POST" autocomplete="off">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="form-actions">
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-soft">Cancel</a>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Create
                        record</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
