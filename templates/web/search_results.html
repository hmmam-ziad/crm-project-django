{% extends 'base.html' %}

{% block title %}Search results &middot; Django CRM{% endblock %}

{% block content %}
<div class="container page">
    <div class="page-header">
        <div>
            <h1>Search results</h1>
            <p>{{ records|length }} result{{ records|length|pluralize }} for <strong class="text-dark">&ldquo;{{ query
                    }}&rdquo;</strong></p>
        </div>
        <a href="{% url 'dashboard' %}" class="btn btn-outline-soft"><i class="bi bi-arrow-left me-1"></i> Back to
            dashboard</a>
    </div>

    <div class="surface overflow-hidden">
        <div class="toolbar">
            <form method="GET" action="{% url 'search_records' %}" class="search-box">
                <i class="bi bi-search"></i>
                <input type="search" class="form-control" placeholder="Search records..." name="query"
                    value="{{ query }}">
                <button class="btn btn-primary" type="submit">Search</button>
            </form>
        </div>

        {% include 'components/records_table.html' %}
    </div>
</div>
{% endblock %}
